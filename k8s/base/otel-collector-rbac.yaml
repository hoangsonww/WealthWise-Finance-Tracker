apiVersion: v1
kind: ServiceAccount
metadata:
  name: wealthwise-otel-collector
  namespace: wealthwise
  labels:
    app.kubernetes.io/name: wealthwise-otel-collector
    app.kubernetes.io/component: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: wealthwise-otel-collector
  labels:
    app.kubernetes.io/name: wealthwise-otel-collector
    app.kubernetes.io/component: observability
rules:
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - namespaces
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch
  - apiGroups: [""]
    resources:
      - nodes/stats
      - nodes/proxy
    verbs:
      - get
  - apiGroups: ["apps"]
    resources:
      - replicasets
      - deployments
      - statefulsets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: wealthwise-otel-collector
  labels:
    app.kubernetes.io/name: wealthwise-otel-collector
    app.kubernetes.io/component: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: wealthwise-otel-collector
subjects:
  - kind: ServiceAccount
    name: wealthwise-otel-collector
    namespace: wealthwise
