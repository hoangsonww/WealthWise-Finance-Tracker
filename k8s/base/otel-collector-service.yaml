apiVersion: v1
kind: Service
metadata:
  name: wealthwise-otel-collector
  namespace: wealthwise
  labels:
    app.kubernetes.io/name: wealthwise-otel-collector
    app.kubernetes.io/component: observability
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: wealthwise-otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP
