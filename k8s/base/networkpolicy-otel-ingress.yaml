apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wealthwise-otel-collector-ingress
  namespace: wealthwise
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wealthwise-otel-collector
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: wealthwise
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
