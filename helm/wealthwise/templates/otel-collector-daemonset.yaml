{{- if and .Values.coralogix.enabled .Values.coralogix.otelCollector.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "wealthwise.fullname" . }}-otel-collector
  namespace: {{ include "wealthwise.namespace" . }}
  labels:
    {{- include "wealthwise.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "wealthwise.fullname" . }}-otel-collector
  labels:
    {{- include "wealthwise.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: observability
rules:
  - apiGroups: [""]
    resources:
      - pods
      - nodes
      - nodes/stats
      - namespaces
      - endpoints
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - replicasets
      - deployments
      - daemonsets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - nonResourceURLs:
      - "/metrics"
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "wealthwise.fullname" . }}-otel-collector
  labels:
    {{- include "wealthwise.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "wealthwise.fullname" . }}-otel-collector
subjects:
  - kind: ServiceAccount
    name: {{ include "wealthwise.fullname" . }}-otel-collector
    namespace: {{ include "wealthwise.namespace" . }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "wealthwise.fullname" . }}-otel-collector
  namespace: {{ include "wealthwise.namespace" . }}
  labels:
    {{- include "wealthwise.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: observability
    app.kubernetes.io/name: {{ include "wealthwise.fullname" . }}-otel-collector
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "wealthwise.fullname" . }}-otel-collector
      app.kubernetes.io/component: observability
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/otel-collector-configmap.yaml") . | sha256sum }}
      labels:
        app.kubernetes.io/name: {{ include "wealthwise.fullname" . }}-otel-collector
        app.kubernetes.io/component: observability
        {{- include "wealthwise.commonLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "wealthwise.fullname" . }}-otel-collector
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: otel-collector
          image: "{{ .Values.coralogix.otelCollector.image.repository }}:{{ .Values.coralogix.otelCollector.image.tag }}"
          imagePullPolicy: {{ .Values.coralogix.otelCollector.image.pullPolicy }}
          args:
            - "--config=/etc/otelcol/otel-collector-config.yaml"
          env:
            - name: CX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "wealthwise.fullname" . }}-coralogix
                  key: CX_API_KEY
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: otlp-grpc
              containerPort: {{ .Values.coralogix.otelCollector.ports.otlpGrpc }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ .Values.coralogix.otelCollector.ports.otlpHttp }}
              protocol: TCP
            - name: fluent-forward
              containerPort: {{ .Values.coralogix.otelCollector.ports.fluentForward }}
              protocol: TCP
            - name: health-check
              containerPort: {{ .Values.coralogix.otelCollector.ports.healthCheck }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: health-check
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: health-check
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.coralogix.otelCollector.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: otel-config
              mountPath: /etc/otelcol
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
      volumes:
        - name: otel-config
          configMap:
            name: {{ include "wealthwise.fullname" . }}-otel-collector
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
      tolerations:
        - effect: NoSchedule
          operator: Exists
{{- end }}
