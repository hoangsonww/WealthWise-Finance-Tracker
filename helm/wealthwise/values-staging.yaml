# Staging overrides.
# Inherits base defaults (2 replicas, HPA/PDB/topology enabled).

ingress:
  host: staging.wealthwise.example.com
  tls:
    secretName: wealthwise-staging-tls

web:
  nextauthUrl: "https://staging.wealthwise.example.com"
  nextPublicApiUrl: "https://staging.wealthwise.example.com/api/v1"

coralogix:
  enabled: true
  domain: "coralogix.us"
  applicationName: "wealthwise-staging"
  otelCollector:
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "250m"
