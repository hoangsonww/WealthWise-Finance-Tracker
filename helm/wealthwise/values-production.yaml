# Production overrides.
# Bumps replicas and resource limits above base defaults.

api:
  replicaCount: 3
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

web:
  replicaCount: 3
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

coralogix:
  enabled: true
  domain: "coralogix.us"
  applicationName: "wealthwise"
  otelCollector:
    resources:
      requests:
        memory: "512Mi"
        cpu: "500m"
      limits:
        memory: "1Gi"
        cpu: "1000m"
    scrapeInterval: "15s"
